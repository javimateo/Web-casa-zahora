# Casa Oliari · nginx para la web estática (se incluye dentro del bloque http)

# Caché según el tipo de recurso
map $uri $cache_control {
  ~^/_astro/                 "public, max-age=31536000, immutable";  # archivos con hash: 1 año
  ~*\.(mp4|webm|svg|ico)$    "public, max-age=604800";               # vídeo y favicon: 1 semana
  default                    "no-cache";                              # HTML: siempre la última versión
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Compresión (AVIF, WebP y MP4 ya van comprimidos)
  gzip on;
  gzip_comp_level 6;
  gzip_min_length 1024;
  gzip_types text/css application/javascript application/json image/svg+xml application/xml text/xml;

  # Cabeceras (todas en el bloque server para que se apliquen a cualquier ruta)
  add_header Cache-Control $cache_control always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  error_page 404 /404.html;
}
